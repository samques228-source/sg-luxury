<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SG Luxury | Catálogo de Perfumes</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:'Poppins',sans-serif;
    color:#fff;
}

header{
    text-align:center;
    padding:35px 20px;
    border-bottom:1px solid rgba(255,255,255,.15);
}

.logo{
    width:150px;
    height:150px;
    margin:auto;
    border:2px solid #fff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Cinzel',serif;
    font-size:60px;
    font-weight:bold;
    letter-spacing:-8px;
}

.logo span:last-child{
    margin-left:-15px;
}

h1{
    margin-top:25px;
    font-family:'Cinzel',serif;
    font-size:42px;
    letter-spacing:12px;
}

p{
    margin-top:10px;
    color:#cfcfcf;
    letter-spacing:5px;
}

.pdf{
    width:100%;
    height:calc(100vh - 270px);
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

footer{
    text-align:center;
    padding:15px;
    color:#888;
    font-size:13px;
    border-top:1px solid rgba(255,255,255,.15);
}

</style>

</head>

<body>

<header>

<div class="logo">
<span>S</span><span>G</span>
</div>

<h1>LUXURY</h1>

<p>CATÁLOGO OFICIAL DE PERFUMES</p>

</header>

<div class="pdf">

<iframe src="Sergio%20catalogo%20perfumes.pdf"></iframe>

</div>

<footer>
© 2026 SG LUXURY • Perfumes Exclusivos
</footer>

</body>
</html>
