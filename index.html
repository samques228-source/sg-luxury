```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SG Luxury | Catálogo de Perfumes</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:'Poppins',sans-serif;
    color:#fff;
}

/* ENCABEZADO MÁS CORTO */
header{
    text-align:center;
    padding:18px 20px 15px;
    border-bottom:1px solid rgba(255,255,255,.15);
}

/* LOGO MÁS PEQUEÑO */
.logo{
    width:90px;
    height:90px;
    margin:auto;
    border:2px solid #fff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Cinzel',serif;
    font-size:38px;
    font-weight:bold;
    letter-spacing:-5px;
}

.logo span:last-child{
    margin-left:-9px;
}

/* TÍTULO */
h1{
    margin-top:10px;
    font-family:'Cinzel',serif;
    font-size:28px;
    letter-spacing:8px;
}

/* SUBTÍTULO */
p{
    margin-top:5px;
    color:#cfcfcf;
    letter-spacing:3px;
    font-size:11px;
}

/* CATÁLOGO */
.pdf{
    width:100%;
    height:calc(100vh - 160px);
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* PIE DE PÁGINA */
footer{
    text-align:center;
    padding:10px;
    color:#888;
    font-size:11px;
    border-top:1px solid rgba(255,255,255,.15);
}

</style>

</head>

<body>

<header>

<div class="logo">
<span>S</span><span>G</span>
</div>

<h1>LUXURY</h1>

<p>CATÁLOGO OFICIAL DE PERFUMES</p>

</header>

<div class="pdf">

<iframe src="sergio catalogo perfumes.pdf"></iframe>

</div>

<footer>
© 2026 SG LUXURY • Perfumes Exclusivos
</footer>

</body>
</html>
```
